[project]
name = "commscoach"
version = "0.1.0"
description = "Personal communications coach: track interactions, generate feedback, export Markdown."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sébastien Lavoie" },
]
dependencies = []

[project.scripts]
commscoach = "commscoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

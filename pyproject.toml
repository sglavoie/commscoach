[project]
name = "commscoach"
version = "0.1.0"
description = "Personal communications coach: track interactions, generate feedback, export Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Sébastien Lavoie" },
]
dependencies = []

[project.scripts]
commscoach = "commscoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commscoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The formatter wraps code; the remaining long lines are prose in strings.
ignore = ["E501"]
